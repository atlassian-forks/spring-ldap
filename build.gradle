buildscript {
	repositories {
		maven { url "https://packages.atlassian.com/maven/repository/public" }
		gradlePluginPortal()
		mavenCentral()
	}
    dependencies {
        classpath "com.github.ben-manes:gradle-versions-plugin:0.36.0"
		classpath "io.spring.gradle:dependency-management-plugin:1.1.4"
        classpath 'org.hidetake:gradle-ssh-plugin:2.10.1'
    }
}

allprojects {
    repositories {
        maven { url "https://packages.atlassian.com/maven/repository/public" }
        mavenCentral()
    }
}

apply plugin: 'io.spring.convention.root'
apply plugin: 'io.spring.convention.docs'

group = "org.springframework.ldap"
description = "Spring LDAP"

ext.coreModules = [
    project(':spring-ldap-core'),
    project(':spring-ldap-core-tiger'),
    project(':spring-ldap-ldif-core'),
    project(':spring-ldap-odm'),
    project(':spring-ldap-test')
]

tasks.register('buildFork') {
    group = 'build'
    description = 'Builds and checks the libraries published by the Atlassian fork.'
    dependsOn coreModules.collect { "${it.path}:build" }
}

tasks.register('publishForkToLocal') {
    group = 'publishing'
    description = 'Publishes the fork libraries to build/publications/repos for inspection.'
    dependsOn coreModules.collect { "${it.path}:publishMavenJavaPublicationToLocalRepository" }
}

tasks.register('publishFork') {
    group = 'publishing'
    description = 'Publishes the fork libraries to the Atlassian third-party Maven repository.'
    dependsOn coreModules.collect { "${it.path}:publishArtifacts" }
}

nohttp {
	allowlistFile = project.file("etc/nohttp/allowlist.lines")
	source.exclude "buildSrc/build/**"
}

asciidoctor {
	outputDir = new File("$buildDir/docs")
	attributes([
		copycss : '',
		icons : 'font',
		'source-highlighter': 'prettify',
		sectanchors : '',
		toc2: '',
		idprefix: '',
		idseparator: '-',
		doctype: 'book',
		numbered: '',
		'spring-ldap-version' : project.version,
		revnumber : project.version
	])
	options = [
		eruby: 'erubis'
	]
}
