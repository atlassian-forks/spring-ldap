name: Atlassian Fork CI

on:
  push:
    branches-ignore:
      - "dependabot/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Build, test and stage Maven artifacts locally
        run: ./gradlew --no-daemon buildFork publishForkToLocal
